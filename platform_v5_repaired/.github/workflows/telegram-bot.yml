name: Telegram Bot

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose whether to run verification or start the bot'
        required: true
        default: test
        type: choice
        options:
          - test
          - start

permissions:
  contents: read

concurrency:
  group: telegram-bot-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    name: Verify project
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_TEST_SOURCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run verification suite
        run: PYTHONPATH=. python scripts/verify_v3.py

      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q

  start-bot:
    name: Start Telegram bot
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      AI_TIMEOUT: '25'
      PLUGIN_TIMEOUT: '12'
      HTTP_TIMEOUT: '8'
      PLAYBACK_TIMEOUT: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo 'ERROR: Add BOT_TOKEN in Settings > Secrets and variables > Actions.'
            exit 1
          fi
          if [ -z "${ADMIN_IDS:-}" ]; then
            echo 'WARNING: ADMIN_IDS is empty; admin controls may be unavailable.'
          fi

      - name: Start bot
        run: PYTHONPATH=. python main.py
