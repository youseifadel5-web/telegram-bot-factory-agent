name: يوسف بوت

on:
  workflow_dispatch:

jobs:
  validate-and-run:
    name: يوسف بوت — فحص وتشغيل
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      API_ID: ${{ secrets.API_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate configuration without exposing secrets
        run: |
          test -n "$ADMIN_ID"
          test -n "$API_HASH"
          test -n "$API_ID"
          test -n "$BOT_TOKEN"
          echo "Telegram secret presence validated; values are not printed."
      - name: Typecheck and tests
        run: pnpm run check && pnpm test
      - name: Build
        run: pnpm run build
      - name: Verify runtime environment
        run: |
          for key in ADMIN_ID API_ID API_HASH BOT_TOKEN; do
            if [ -n "${!key}" ]; then echo "$key=present"; else echo "$key=missing"; exit 1; fi
          done
      - name: Run يوسف بوت
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NODE_ENV: production
        run: pnpm run start
