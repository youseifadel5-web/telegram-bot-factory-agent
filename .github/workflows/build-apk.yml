name: Build APK and Send to Telegram

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build small signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK was produced."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          cp "$APK" "YouseifPlayerPro-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouseifPlayerPro-APK-${{ github.run_number }}
          path: YouseifPlayerPro-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Send APK to Telegram
        env:
          # Uses the existing GitHub secrets from your bot repo.
          # Fallback names are supported if you already have them.
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_ID || secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping Telegram delivery."
            exit 0
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@YouseifPlayerPro-${GITHUB_RUN_NUMBER}.apk" \
            -F "caption=📦 Youseif Player Pro\nBuild #${GITHUB_RUN_NUMBER}\nSize: ${{ steps.apk.outputs.size }}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
