name: Youseif Stream Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: youseif-stream-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Keep one bot instance alive for the scheduled window. The next scheduled
    # run uses concurrency.cancel-in-progress to stop this instance cleanly.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Start stream bot for the service window
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          AI_ENABLED: ${{ secrets.AI_ENABLED }}
          AI_MAX_RETRIES: ${{ secrets.AI_MAX_RETRIES }}
          AI_MODE: ${{ secrets.AI_MODE }}
          AI_TIMEOUT: ${{ secrets.AI_TIMEOUT }}
          API_HASH: ${{ secrets.API_HASH }}
          API_ID: ${{ secrets.API_ID }}
          API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          AUTO_BUILD_ON_EVIDENCE: ${{ secrets.AUTO_BUILD_ON_EVIDENCE }}
          BOT_FACTORY_ROOT: ${{ secrets.BOT_FACTORY_ROOT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PYROGRAM_FILE_LIMIT: ${{ secrets.PYROGRAM_FILE_LIMIT }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FFMPEG_PATH: ffmpeg
        # GitHub-hosted runners are temporary, so run the bot for one scheduled
        # window instead of killing it after the startup notification.
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 330m ./start.sh
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Bot service window ended normally (timeout is expected)."
            exit 0
          fi
          exit "$code"

      - name: Cleanup bot processes
        if: always()
        run: |
          for pattern in "$GITHUB_WORKSPACE/main.py" "$GITHUB_WORKSPACE/boot.py" "$GITHUB_WORKSPACE/bin/ffmpeg"; do
            while read -r pid; do
              [ -n "$pid" ] || continue
              [ "$pid" = "$$" ] && continue
              kill -TERM "$pid" 2>/dev/null || true
            done < <(pgrep -f "$pattern" || true)
          done
