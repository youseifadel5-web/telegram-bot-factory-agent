name: تشغيل بوت السينما

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"

concurrency:
  group: cinema-bot
  cancel-in-progress: true

# ثلاث أسرار فقط من متغيرات البيئة.
# باقي الإعدادات (IPTV, PROXY...) تيجي من config.py المرفوع مع المشروع.
env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  API_ID: ${{ secrets.API_ID }}
  API_HASH: ${{ secrets.API_HASH }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
