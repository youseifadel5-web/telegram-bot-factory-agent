name: Youseif Stream Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: youseif-stream-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Start stream bot
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          AI_ENABLED: ${{ secrets.AI_ENABLED }}
          AI_MAX_RETRIES: ${{ secrets.AI_MAX_RETRIES }}
          AI_MODE: ${{ secrets.AI_MODE }}
          AI_TIMEOUT: ${{ secrets.AI_TIMEOUT }}
          API_HASH: ${{ secrets.API_HASH }}
          API_ID: ${{ secrets.API_ID }}
          API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          AUTO_BUILD_ON_EVIDENCE: ${{ secrets.AUTO_BUILD_ON_EVIDENCE }}
          BOT_FACTORY_ROOT: ${{ secrets.BOT_FACTORY_ROOT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PYROGRAM_FILE_LIMIT: ${{ secrets.PYROGRAM_FILE_LIMIT }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FFMPEG_PATH: ffmpeg
        # The bot is a long-running service; CI only needs a startup smoke test.
        # A timeout is expected after successful initialization and prevents a
        # workflow run from occupying a runner for the whole service lifetime.
        run: |
          set +e
          timeout --signal=TERM 45s python main.py
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Bot startup smoke test completed (timeout is expected)."
            exit 0
          fi
          exit "$code"
