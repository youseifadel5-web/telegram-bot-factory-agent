name: تشغيل البوت المدمج

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: merged-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: فحص Python
        run: python -m py_compile bot.py cinema_core.py youseif_core.py config.py plugin_loader.py api/auth.py api/server.py api/run.py

      - name: تشغيل البوت
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          API_HOST: ${{ vars.API_HOST || '0.0.0.0' }}
          API_PORT: ${{ vars.API_PORT || '8000' }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://127.0.0.1:8000' }}
          API_PUBLIC_BASE_URL: ${{ vars.API_PUBLIC_BASE_URL || '' }}
          API_CORS_ORIGINS: ${{ vars.API_CORS_ORIGINS || '*' }}
          API_SESSION_TTL: ${{ vars.API_SESSION_TTL || '86400' }}
          API_LOGIN_TTL: ${{ vars.API_LOGIN_TTL || '300' }}
          API_STREAM_TTL: ${{ vars.API_STREAM_TTL || '900' }}
        run: python bot.py
