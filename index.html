<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>𝑌𝑜𝑢𝑠𝑒𝑖𝑓 𝐹𝑖𝑙𝑚𝑠 🎬</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
  /* ===== Cinema Mode — خلفية سوداء بدون هوامش ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* الحاوية تملأ الشاشة وتتوسط المحتوى */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  /* المشغل يملأ الشاشة ومتجاوب 100% */
  #player-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }

  video {
    width: 100%;
    height: 100%;
    background: #000;
  }

  .plyr { width: 100%; height: 100%; }
  .plyr__video-wrapper { height: 100%; background: #000; }
  .plyr video { object-fit: contain; }

  /* تلوين أزرار Plyr بهوية البوت */
  :root {
    --plyr-color-main: #e50914;
    --plyr-video-control-color-hover: #fff;
    --plyr-menu-background: rgba(15, 15, 15, 0.95);
    --plyr-menu-color: #fff;
  }

  /* ===== العلامة المائية ===== */
  #watermark {
    position: absolute;
    top: 12px;
    right: 16px;
    z-index: 40;
    font-size: clamp(18px, 3.5vw, 30px);
    font-weight: 600;
    color: #fff;
    opacity: 0.7;
    pointer-events: none;      /* لا يعيق النقر على الفيديو */
    user-select: none;
    text-shadow: 0 2px 10px rgba(229, 9, 20, 0.55), 0 0 4px rgba(0,0,0,.8);
    letter-spacing: 1px;
  }

  /* العلامة تبقى ظاهرة داخل ملء الشاشة لأن الحاوية هي عنصر ملء الشاشة */
  #player-wrap:fullscreen #watermark { display: block; }

  /* ===== شاشة الخطأ ===== */
  #error-box {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  #error-box .icon { font-size: 52px; }
  #error-box .msg  { font-size: 17px; opacity: .85; line-height: 1.9; }
  #error-box code {
    direction: ltr;
    display: inline-block;
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: #ff8080;
    max-width: 92vw;
    overflow-wrap: anywhere;
  }

  /* شاشة تحميل بسيطة */
  #loader {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    transition: opacity .3s;
    pointer-events: none;
  }
  #loader .spin {
    width: 54px; height: 54px;
    border: 4px solid rgba(255,255,255,.15);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="stage">
  <div id="player-wrap">
    <!-- العلامة المائية (ثابتة، شفافة، لا تعيق النقر، وتبقى في ملء الشاشة) -->
    <div id="watermark">𝑌𝑜𝑢𝑠𝑒𝑖𝑓</div>

    <video id="player" playsinline controls crossorigin="anonymous"></video>

    <div id="loader"><div class="spin"></div></div>

    <div id="error-box">
      <div class="icon">🎬</div>
      <div class="msg" id="error-msg">لا يوجد رابط فيديو.<br>أرسل الرابط من البوت بهذا الشكل:</div>
      <code>index.html?url=VIDEO_URL&amp;sub=SUBTITLE.vtt</code>
    </div>
  </div>
</div>

<!-- المكتبات عبر CDN -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<script>
(function () {
  "use strict";

  // ===== 1) قراءة الرابط ديناميكياً من شريط العنوان =====
  var params   = new URLSearchParams(window.location.search);
  var videoUrl = params.get("url");           // رابط الفيديو (m3u8 أو mp4)
  var subUrl   = params.get("sub");           // رابط الترجمة VTT (اختياري)

  var video    = document.getElementById("player");
  var loader   = document.getElementById("loader");
  var errorBox = document.getElementById("error-box");
  var errorMsg = document.getElementById("error-msg");

  function showError(msg) {
    loader.style.display = "none";
    errorBox.style.display = "flex";
    if (msg) errorMsg.innerHTML = msg;
  }
  function hideLoader() {
    loader.style.opacity = "0";
    setTimeout(function () { loader.style.display = "none"; }, 350);
  }

  if (!videoUrl) { showError(null); return; }
  videoUrl = decodeURIComponent(videoUrl);
  if (subUrl) subUrl = decodeURIComponent(subUrl);

  var isHls = /\.m3u8($|\?)/i.test(videoUrl);

  // ===== 2) خيارات Plyr الأساسية (كل عناصر التحكم المطلوبة) =====
  var plyrOptions = {
    title: "𝑌𝑜𝑢𝑠𝑒𝑖𝑓 𝐹𝑖𝑙𝑚𝑠",
    controls: [
      "play-large", "play", "progress", "current-time", "duration",
      "mute", "volume", "captions", "settings", "pip", "fullscreen"
    ],
    settings: ["captions", "quality", "speed"],
    speed: { selected: 1, options: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
    quality: { default: 0, options: [0], forced: true },
    i18n: {
      play: "تشغيل", pause: "إيقاف", mute: "كتم", unmute: "إلغاء الكتم",
      settings: "الإعدادات", speed: "السرعة", normal: "عادي",
      quality: "الجودة", captions: "الترجمة", fullscreen: "ملء الشاشة",
      pip: "صورة داخل صورة",
      qualityLabel: { 0: "تلقائي ✨" }
    },
    fullscreen: { enabled: true, fallback: true, iosNative: true, container: "#player-wrap" },
    keyboard: { focused: true, global: true },
    tooltips: { controls: true, seek: true }
  };

  // الترجمة (اختيارية) — تُضاف كـ track على عنصر الفيديو قبل إنشاء Plyr
  if (subUrl) {
    var track = document.createElement("track");
    track.kind = "subtitles";
    track.label = "العربية";
    track.srclang = "ar";
    track.src = subUrl;
    track.default = true;
    video.appendChild(track);
  }

  var player = null;

  // ===== 3) تشغيل HLS مع ربط الجودات بقائمة Plyr (الطريقة الرسمية) =====
  function startHls() {
    var hls = new Hls({
      capLevelToPlayerSize: false,
      maxBufferLength: 30,
      enableWorker: true
    });
    hls.loadSource(videoUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      // استخراج الجودات من مستويات HLS وإضافتها لقائمة Plyr قبل إنشاء المشغل
      var levels = hls.levels || [];
      var heights = [];
      for (var i = 0; i < levels.length; i++) {
        var h = levels[i].height;
        if (h && heights.indexOf(h) === -1) heights.push(h);
      }
      heights.sort(function (a, b) { return b - a; }); // من الأعلى للأقل

      if (heights.length) {
        var opts = [0].concat(heights); // 0 = تلقائي
        plyrOptions.quality = {
          default: 0,
          options: opts,
          forced: true,
          onChange: function (q) {
            if (q === 0) {
              hls.currentLevel = -1; // تلقائي (ABR)
            } else {
              for (var j = 0; j < levels.length; j++) {
                if (levels[j].height === q) { hls.currentLevel = j; break; }
              }
            }
          }
        };
        // تسميات واضحة: تلقائي ✨ / 1080p / 720p / 480p
        var labels = { 0: "تلقائي ✨" };
        heights.forEach(function (h) { labels[h] = h + "p"; });
        plyrOptions.i18n.qualityLabel = labels;
      }

      player = new Plyr(video, plyrOptions);
      video.play().catch(function () {});
    });

    hls.on(Hls.Events.ERROR, function (_, data) {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        hls.startLoad(); // إعادة محاولة الشبكة تلقائياً
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        showError("❌ تعذر تشغيل البث.<br>تأكد أن الرابط شغال وأن السيرفر يسمح بالوصول (CORS).<br><code>" + videoUrl + "</code>");
      }
    });
  }

  // ===== 4) اختيار طريقة التشغيل حسب نوع الرابط =====
  if (isHls && window.Hls && Hls.isSupported()) {
    startHls();
  } else if (isHls && video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari / iOS يدعم HLS أصلاً
    video.src = videoUrl;
    player = new Plyr(video, plyrOptions);
  } else {
    // mp4 أو أي صيغة مباشرة
    video.src = videoUrl;
    player = new Plyr(video, plyrOptions);
  }

  // ===== 5) لمسات أخيرة =====
  video.addEventListener("playing", hideLoader);
  video.addEventListener("canplay", hideLoader);
  video.addEventListener("error", function () {
    if (video.error && video.src) {
      showError("❌ تعذر تحميل الفيديو.<br>تأكد من الرابط ومن دعم السيرفر لـ CORS.<br><code>" + videoUrl + "</code>");
    }
  });
})();
</script>
</body>
</html>
